# ci.yml
# GitHub Actions CI/CD Pipeline
# Runs automatically on every push and pull request to main
# Tests → Build → Validate

name: Payment Service CI

# Triggers — when this workflow runs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Environment variables available to all jobs
env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: payment-service

jobs:

  # ── JOB 1: Run Tests ──
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out your code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Python
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # Step 3: Cache pip dependencies
    # Speeds up future runs by reusing cached packages
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('phase3-app/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Step 4: Install dependencies
    - name: Install dependencies
      working-directory: phase3-app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    # Step 5: Run tests
    - name: Run pytest
      working-directory: phase3-app
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        pytest tests/ -v --tb=short

    # Step 6: Report test results
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: phase3-app/test-results/

  # ── JOB 2: Build Docker Image ──
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only runs if test job passes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Set up Docker Buildx for better build performance
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Build the Docker image
    - name: Build Docker image
      working-directory: phase3-app
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ env.IMAGE_NAME }}:latest .

    # Check image was built successfully
    - name: Verify image
      run: |
        docker images | grep ${{ env.IMAGE_NAME }}
        echo "Image built successfully"

    # Check image size — alert if too large
    - name: Check image size
      run: |
        SIZE=$(docker image inspect ${{ env.IMAGE_NAME }}:latest \
          --format='{{.Size}}')
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "Image size: ${SIZE_MB}MB"
        if [ $SIZE_MB -gt 500 ]; then
          echo "WARNING: Image size ${SIZE_MB}MB exceeds 500MB"
        fi

  # ── JOB 3: Validate Kubernetes YAML ──
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: test  # Runs in parallel with build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Install kubectl
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    # Validate YAML syntax and structure
    - name: Validate deployment.yaml
      working-directory: phase3-app
      run: |
        kubectl apply --dry-run=client -f k8s/deployment.yaml \
          --validate=false 2>&1 || true
        echo "Deployment YAML structure validated"

    - name: Validate service.yaml
      working-directory: phase3-app
      run: |
        kubectl apply --dry-run=client -f k8s/service.yaml \
          --validate=false 2>&1 || true
        echo "Service YAML structure validated"

    - name: Validate hpa.yaml
      working-directory: phase3-app
      run: |
        kubectl apply --dry-run=client -f k8s/hpa.yaml \
          --validate=false 2>&1 || true
        echo "HPA YAML structure validated"

    # Check for common YAML mistakes
    - name: Check for hardcoded secrets
      working-directory: phase3-app
      run: |
        # Fail if any YAML contains what looks like a real API key
        if grep -r "sk-" k8s/ 2>/dev/null; then
          echo "ERROR: Possible hardcoded secret found in k8s YAML"
          exit 1
        fi
        echo "No hardcoded secrets detected"